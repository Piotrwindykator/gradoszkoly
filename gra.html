<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Survival JS</title>

<style>
    body {
        margin: 0;
        background: #111;
        overflow: hidden;
        font-family: Arial;
        color: white;
    }

    canvas {
        display: block;
        margin: 50px auto 0;
        background: #1b1b2f;
        border: 3px solid white;
    }

    #info {
        position: fixed;
        top: 10px;
        left: 10px;
        font-size: 20px;
    }
</style>
</head>

<body>

<div id="info">
    ❤️ Życie: <span id="hp">3</span>
    &nbsp;&nbsp;
    🪙 Monety: <span id="score">0</span>
</div>

<canvas id="game" width="900" height="600"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const keys = {};

document.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});


/* =========================
        GRACZ
========================= */

const player = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    size: 30,
    speed: 5,
    hp: 3
};


/* =========================
        PRZECIWNIK
========================= */

const enemy = {
    x: 100,
    y: 100,
    size: 35,
    speed: 2
};


/* =========================
        MONETY
========================= */

const coins = [];

const NUMBER_OF_COINS = 10;

let score = 0;


/* Tworzenie monety */

function createCoin() {

    return {
        x: Math.random() * (canvas.width - 40) + 20,
        y: Math.random() * (canvas.height - 40) + 20,
        size: 12
    };

}


/* Tworzymy 10 monet na początku */

for (let i = 0; i < NUMBER_OF_COINS; i++) {
    coins.push(createCoin());
}


/* =========================
        ODLEGŁOŚĆ
========================= */

function distance(a, b) {

    return Math.sqrt(
        (a.x - b.x) ** 2 +
        (a.y - b.y) ** 2
    );

}


/* =========================
        UPDATE
========================= */

function update() {


    /* RUCH GRACZA */

    if (keys["w"]) player.y -= player.speed;
    if (keys["s"]) player.y += player.speed;
    if (keys["a"]) player.x -= player.speed;
    if (keys["d"]) player.x += player.speed;


    /* =========================
       GRANICE MAPY
    ========================= */

    const half = player.size / 2;

    player.x = Math.max(
        half,
        Math.min(canvas.width - half, player.x)
    );

    player.y = Math.max(
        half,
        Math.min(canvas.height - half, player.y)
    );


    /* =========================
       WRÓG IDZIE DO GRACZA
    ========================= */

    const dx = player.x - enemy.x;
    const dy = player.y - enemy.y;

    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist > 0) {

        enemy.x += (dx / dist) * enemy.speed;
        enemy.y += (dy / dist) * enemy.speed;

    }


    /* =========================
       ZBIERANIE MONET
    ========================= */

    for (let i = 0; i < coins.length; i++) {

        const coin = coins[i];

        if (distance(player, coin) < 30) {

            score++;

            document.getElementById("score").textContent = score;

            /* Usuwamy starą monetę */

            coins.splice(i, 1);

            /* Tworzymy nową */

            coins.push(createCoin());

            /* Wróg robi się szybszy */

            enemy.speed += 0.1;

            break;
        }
    }


    /* =========================
       KONTAKT Z WROGIEM
    ========================= */

    if (distance(player, enemy) < 30) {

        player.hp--;

        document.getElementById("hp").textContent = player.hp;

        /* Teleport gracza na środek */

        player.x = canvas.width / 2;
        player.y = canvas.height / 2;


        if (player.hp <= 0) {

            alert(
                "💀 KONIEC GRY!\n\n" +
                "Zdobyte monety: " + score
            );

            location.reload();

        }

    }

}


/* =========================
        RYSOWANIE
========================= */

function draw() {


    /* TŁO */

    ctx.fillStyle = "#1b1b2f";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* SIATKA */

    ctx.strokeStyle = "#292947";

    for (let x = 0; x <= canvas.width; x += 50) {

        ctx.beginPath();

        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);

        ctx.stroke();

    }


    for (let y = 0; y <= canvas.height; y += 50) {

        ctx.beginPath();

        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);

        ctx.stroke();

    }


    /* =========================
          MONETY
    ========================= */

    for (const coin of coins) {

        ctx.fillStyle = "gold";

        ctx.beginPath();

        ctx.arc(
            coin.x,
            coin.y,
            coin.size,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    /* =========================
          GRACZ
    ========================= */

    ctx.fillStyle = "#00ff88";

    ctx.fillRect(
        player.x - player.size / 2,
        player.y - player.size / 2,
        player.size,
        player.size
    );


    /* =========================
          WRÓG
    ========================= */

    ctx.fillStyle = "#ff304f";

    ctx.beginPath();

    ctx.arc(
        enemy.x,
        enemy.y,
        enemy.size / 2,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* OCZY */

    ctx.fillStyle = "white";

    ctx.fillRect(
        enemy.x - 10,
        enemy.y - 7,
        5,
        5
    );

    ctx.fillRect(
        enemy.x + 5,
        enemy.y - 7,
        5,
        5
    );

}


/* =========================
        PĘTLA GRY
========================= */

function gameLoop() {

    update();

    draw();

    requestAnimationFrame(gameLoop);

}

gameLoop();

</script>

</body>
</html>
